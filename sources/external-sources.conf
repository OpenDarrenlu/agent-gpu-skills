# 外部来源清单（tracked）。由 install-external.sh 与 install.sh 读取。
# 源码 checkout 放在 repos/<name>/（git-ignored，不 vendoring 进本仓库）。
#
# 字段（用 | 分隔，空字段写 -）:
#   name        : checkout 目录名，也是 update-repos.sh 的目标名；无 frontmatter name 时 skill 名取目录名
#   url         : git 远端
#   ref         : 40 位 commit SHA（固定版本）。UNPINNED 只允许用于尚未检视的来源（当前无）
#   mode        : skills  = 递归查找 skills_dir 下的 SKILL.md 并安装（同名先到先得，见 install.sh）
#                 none    = 只获取源码，不安装 skill
#                 pending = 尚未检视，不能安装（真实安装返回失败）
#   skills_dir  : mode=skills 时的相对目录，相对 repos/<name>/。多个目录用逗号分隔。"." 表示仓库根。
#   runtime     : none | uv:<相对目录>:<可执行名> | npm:<包名@版本>:<可执行名>
#   provenance  : 检视依据、版本与许可
#
# 已移除与当前 LLM infra 工作无关的来源；单个无关 skill 由
# skills/routers/agent-skill-router/references/excluded-skills.txt 排除。
# 修改本文件后：bash update-repos.sh external ；再运行 install.sh 更新 skill 安装。

mattpocock-skills|https://github.com/mattpocock/skills|4ae2317ddb22b046e26455e4f9c9b3aaaf62212d|skills|skills/engineering,skills/productivity,skills/misc|none|MIT（LICENSE, Copyright 2026 Matt Pocock）。插件版本 1.4.0（2026-11 更新：CHANGELOG 增 software-factory 等 changeset；新增 skills/in-progress/software-factory 为未完成技能，同 in-progress 不安装）。安装 engineering、productivity、misc 三类；skills/in-progress 为上游标注的未完成技能，不安装。与 cursor-skills 的同名改写版（tdd、grill-with-docs、improve-codebase-architecture、setup-matt-pocock-skills、prototype、handoff）冲突时 cursor-skills 优先（先到先得，保留 cursor 推理触发词改写）；其余同源名称直接安装上游版本
supervisor-skills|https://github.com/HKUSTDial/Supervisor-Skills.git|4bd3fef393e5ffc891c74309a5ef6c5ad3ad12c8|skills|skills|none|检视 2026-11-08（本地 checkout detached 于 4bd3fef，origin 与 url 一致；2026-11-03 更新仅 README 增补说明，12 个 skill 内容未变）。根 LICENSE 为 CC BY-NC-SA 4.0（Copyright (c) 2026 Yuyu Luo (methodology) and contributors），安装的 skill 副本不含根 LICENSE，归属与许可记在本条与 skills/research/README.md。12 个 SKILL.md 位于 skills/<name>/，frontmatter name 与目录名一致。逐 skill 的 frontmatter license：CC-BY-4.0（figure-designer、idea-evaluator、vibe-research-workflow、tech-paper-template、benchmark-paper-template、pre-submission-reviewer），CC-BY-NC-SA-4.0（deep-research、paper-writer、intro-drafter、paper-polish），rebuttal-guidance 与 drawio-reconstruction 无 frontmatter license。skills/drawio-reconstruction/LICENSE 为 MIT（Copyright (c) 2026 VCG-Bench Authors），随该目录一起安装。skill 之间的依赖均为各自目录内的相对路径（references/、scripts/、agents/、examples/、assets/、requirements.txt）；无 CLI 运行时：安装器不装任何命令，drawio 脚本仅标准库，crop_assist.py 的 Pillow 为可选、需用户批准后自行安装，export_drawio.py 需本机 draw.io 桌面应用，安装器不提供。handbook/ 为仓库根目录的教材，不随任何 skill 安装，仅被 idea-evaluator 与 vibe-research-workflow 作为可选深入阅读引用
