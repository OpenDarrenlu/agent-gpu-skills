# 外部来源清单（tracked）。由 install-external.sh 与 install.sh 读取。
# 源码 checkout 放在 repos/<name>/（git-ignored，不 vendoring 进本仓库）。
#
# 字段（用 | 分隔，空字段写 -）:
#   name        : checkout 目录名，也是 update-repos.sh 的目标名；无 frontmatter name 时 skill 名取目录名
#   url         : git 远端
#   ref         : 40 位 commit SHA（固定版本）。UNPINNED 只允许用于尚未检视的来源（当前无）
#   mode        : skills  = 递归查找 skills_dir 下的 SKILL.md 并安装（同名先到先得，见 install.sh）
#                 none    = 只获取源码，不安装 skill
#                 pending = 尚未检视，不能安装（真实安装返回失败）
#   skills_dir  : mode=skills 时的相对目录，相对 repos/<name>/。多个目录用逗号分隔。"." 表示仓库根。
#                 runtime-skills 为 install-external.sh 从 npm 包链接出的 skills 目录（见 runtime）
#   runtime     : none | uv:<相对目录>:<可执行名> | npm:<包名@版本>:<可执行名>
#                 uv  : uv tool install --force <checkout>/<相对目录>（本地路径安装）
#                 npm : npm install -g <包名@版本>（npm 官方 registry，版本固定）。若 skills_dir=runtime-skills，
#                       再把全局安装包中的 skills/ 链接到 repos/<name>/runtime-skills
#                 安装后检查 command -v <可执行名> 且 <可执行名> --version 退出 0
#   provenance  : 检视依据、版本与许可（2026-10-24 检视）
#
# 修改本文件后：bash update-repos.sh external ；再运行 install.sh 更新 skill 安装。

sepia|https://github.com/Nanako0129/sepia.git|fb06be76abeae7dd606960a32f2b10c1d1798e0d|skills|skills|none|MIT（LICENSE, Copyright 2026 Nanako Tsai）。plugin 版本 0.12.4。skills/sepia 为总路由（references/ 下有风格规则）；skills/sepia-write、sepia-review、sepia-refactor、sepia-recreate、sepia-hemingway 为操作入口，按 ../sepia/SKILL.md 相对路径读取总路由，必须与 sepia 作为同级目录安装。无运行时 CLI
wx-cli|https://github.com/Steady775/wx-cli|08af894594b4afd468e23e17dbd783f15403f13b|skills|.|npm:@jackwener/wx-cli@0.3.0:wx|Apache-2.0。这是 Steady775 fork（origin 为 Steady775/wx-cli，提交 08af894）；README、Cargo.toml、npm 包均为 jackwener/wx-cli 上游 0.3.0。SKILL.md（唯一 frontmatter name=wx-cli）来自 fork；可执行文件来自 npm 官方包 @jackwener/wx-cli@0.3.0（fork 未发布 npm 包，本机也无 cargo）。安装只执行 npm 安装与 wx --version；不执行 sudo wx init、codesign、tccutil、重启微信或读取聊天数据
rea|https://github.com/morluto/rea|3ce311757dd8ac444c8297b2871464536f93816d|skills|runtime-skills|npm:rea-agents@6.7.0:rea|MIT。源码版本 6.7.0（.release-please-manifest.json）。元数据差异：已安装的 rea-agents@6.7.0 npm 包 engines 为 22 系列 ^22.19.0、24 系列 ^24.11.0、以及 >=26.0.0（注意：字段分隔符不能出现在此处）；源码 package.json 同版本号的 engines 更新为 22.23.4 起、24.22.1 起与 26.12.1 起；运行时按 npm 包检查，不以源码为准。仓库内 skills/ 与 dist/ 为构建产物不存在于 clone 中，而 rea-agents@6.7.0 npm 包的 files 含 skills/reverse-engineer-anything（由 .agents/skills 模板经 generate-skill-metadata.mjs 生成，并固定到该版本）。因此 skill 来自 npm 包，不从仓库模板直接安装。.agents/skills/rea-* 为维护者用技能，不安装。安装器只为 codex 注册 REA MCP（install-rea-mcp.sh：rea setup --client codex --skill=false --yes，使用 REA 自身的备份与保留逻辑；--no-rea-mcp 或 --no-integrations 可跳过）。Hopper/Ghidra/IDA 等原生 provider 与 Frida 类安装脚本不在安装器范围内，未经验证
mattpocock-skills|https://github.com/mattpocock/skills|5beb35b040e3de97e54fa9e386d7e42d15c295c2|skills|skills/engineering,skills/productivity,skills/misc|none|MIT（LICENSE, Copyright 2026 Matt Pocock）。插件版本 1.3.1。安装 engineering、productivity、misc 三类；skills/in-progress 为上游标注的未完成技能，不安装。与 cursor-skills 的同名改写版（tdd、grill-with-docs、improve-codebase-architecture、setup-matt-pocock-skills、prototype、handoff）冲突时 cursor-skills 优先（先到先得，保留本地推理触发词改写）；其余同源名称直接安装上游版本
